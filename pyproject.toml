[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posttrainbench0"
version = "0.1.0"
description = "Isolated zeroth-order LLM post-training benchmark runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = ["numpy>=1.26", "ray>=2.40", "transformers>=4.57", "vllm>=0.11"]
test = ["pytest>=8"]

[project.scripts]
posttrainbench0 = "posttrainbench0.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
